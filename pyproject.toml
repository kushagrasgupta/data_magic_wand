[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "whooshql"
version = "0.1.2"
description = "Polars-native data CLI toolkit inspired by DataGristle"
readme = "README.rst"
requires-python = ">=3.13"
license = {text = "BSD-3-Clause"}
authors = [{name = "Kushagra Gupta"}]
dependencies = [
  "polars>=1.40",
  "pyarrow>=17",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "orjson>=3.10",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]
sql = ["duckdb>=1.2"]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "twine>=5.1",
]

[project.scripts]
whooshql = "whooshql.cli.__init__:main"
whooshql_slicer = "whooshql.cli.slicer:main"
whooshql_freaker = "whooshql.cli.freaker:main"
whooshql_profiler = "whooshql.cli.profiler:main"
whooshql_validator = "whooshql.cli.validator:main"
whooshql_viewer = "whooshql.cli.viewer:main"
whooshql_differ = "whooshql.cli.differ:main"
whooshql_sorter = "whooshql.cli.sorter:main"
whooshql_converter = "whooshql.cli.converter:main"
whooshql_merger = "whooshql.cli.merger:main"
whooshql_explore = "whooshql.cli.explore:main"
whooshql_sql = "whooshql.cli.sql:main"
whooshql_sample = "whooshql.cli.sample:main"
whooshql_pivot = "whooshql.cli.pivot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whooshql"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/benchmarks",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
  "/mypy.ini",
  "/.pre-commit-config.yaml",
  "/README.rst",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["whooshql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
