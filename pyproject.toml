[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "whoosh-cli"
version = "0.1.0"
description = "Polars-native data CLI toolkit inspired by DataGristle"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "BSD-3-Clause"}
authors = [{name = "Kushagra Gupta"}]
dependencies = [
  "polars>=1.40",
  "pyarrow>=17",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "orjson>=3.10",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]
sql = ["duckdb>=1.2"]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "twine>=5.1",
]

[project.scripts]
whoosh = "whoosh.cli.__init__:main"
whoosh_slicer = "whoosh.cli.slicer:main"
whoosh_freaker = "whoosh.cli.freaker:main"
whoosh_profiler = "whoosh.cli.profiler:main"
whoosh_validator = "whoosh.cli.validator:main"
whoosh_viewer = "whoosh.cli.viewer:main"
whoosh_differ = "whoosh.cli.differ:main"
whoosh_sorter = "whoosh.cli.sorter:main"
whoosh_converter = "whoosh.cli.converter:main"
whoosh_merger = "whoosh.cli.merger:main"
whoosh_explore = "whoosh.cli.explore:main"
whoosh_sql = "whoosh.cli.sql:main"
whoosh_sample = "whoosh.cli.sample:main"
whoosh_pivot = "whoosh.cli.pivot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whoosh"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/benchmarks",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
  "/mypy.ini",
  "/.pre-commit-config.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["whoosh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
